<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drawing Guess — Permissionless Games</title>
  <meta name="description" content="Guess the hidden word from the emoji clue. Anyone can join mid-round, no account needed.">
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../lib/base.css">
  <link rel="stylesheet" href="../../lib/components.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
</head>
<body>
  <header class="game-header">
    <a class="back-link" href="../../">← Games</a>
    <div class="game-title">🎨 Drawing Guess</div>
    <span id="round-number" class="round-number"></span>
    <div id="share-container"></div>
  </header>

  <main class="game-main">
    <div id="player-list" class="player-list"></div>

    <section class="puzzle-section">
      <div id="clue-emoji" class="clue-emoji" aria-label="Emoji clue">🤔</div>
      <div id="word-blanks" class="word-blanks"></div>
      <div id="game-status" class="game-status"></div>
    </section>

    <div id="keyboard" class="keyboard"></div>
  </main>

  <!-- Shown for 5s when the word is solved; sits on top of the game -->
  <div id="win-overlay" class="win-overlay hidden">
    <div class="win-card">
      <div class="win-stars">🎉 🎊 🎉</div>
      <div id="win-word" class="win-word"></div>
      <div id="win-blanks" class="word-blanks win-blanks"></div>
      <p class="win-next">Next puzzle in <span id="win-countdown">5</span>s</p>
    </div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
