<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snap — Permissionless Games</title>
  <meta name="description" content="Wait for the signal. Tap as fast as you can. Top 3 score points.">
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="../../manifest.json">
  <meta name="theme-color" content="#5c6bc0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="../../lib/base.css">
  <link rel="stylesheet" href="../../lib/components.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
</head>
<body>
  <header class="game-header">
    <a class="back-link" href="../../">← Games</a>
    <div class="game-title">⚡ Snap</div>
    <span id="round-number" class="round-number"></span>
    <div id="share-container"></div>
  </header>

  <main class="game-main">
    <div id="player-list" class="player-list"></div>

    <div id="tap-area" class="tap-area" data-phase="ready"
         role="button" tabindex="0" aria-label="Tap here">

      <!-- Shown during ready / signal / tapped / false-start -->
      <div id="tap-content" class="tap-content">
        <div id="tap-emoji" class="tap-emoji"></div>
        <div id="tap-label" class="tap-label">Get ready…</div>
        <div id="tap-sub" class="tap-sub">Tap when the signal appears</div>
      </div>

      <!-- Shown during results -->
      <div id="results-content" class="results-content hidden">
        <div class="results-title">Results</div>
        <div id="results-list" class="results-list"></div>
      </div>

    </div>
  </main>

  <script type="module" src="game.js"></script>
</body>
</html>
