<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Draw — Permissionless Games</title>
  <meta name="description" content="One canvas, everyone draws on it together. A word appears — you have 60 seconds.">
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="../../manifest.json">
  <meta name="theme-color" content="#5c6bc0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="../../lib/base.css">
  <link rel="stylesheet" href="../../lib/components.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
</head>
<body>
  <header class="game-header">
    <a class="back-link" href="../../">← Games</a>
    <div class="game-title">✏️ Quick Draw</div>
    <span id="round-number" class="round-number"></span>
    <div id="share-container"></div>
  </header>

  <main class="game-main">
    <div id="player-list" class="player-list"></div>

    <div class="word-banner">
      <span id="word-text" class="word-text">Loading…</span>
      <span id="draw-timer" class="timer">60</span>
    </div>

    <!-- canvas-wrap fills remaining space; tools float over it -->
    <div id="canvas-wrap" class="canvas-wrap">
      <canvas id="draw-canvas"></canvas>
      <canvas id="live-canvas"></canvas>
      <div class="canvas-tools">
        <div class="color-wheel-wrap">
          <canvas id="color-wheel" class="color-wheel" width="80" height="80"></canvas>
          <div id="color-preview" class="color-preview"></div>
        </div>
        <div class="stroke-sizes">
          <button class="size-btn active" data-size="3" title="Thin">●</button>
          <button class="size-btn" data-size="7" title="Medium">●</button>
          <button class="size-btn" data-size="14" title="Thick">●</button>
        </div>
        <button id="undo-btn" class="tool-btn">↩</button>
        <button id="clear-btn" class="tool-btn">🗑</button>
      </div>
    </div>
  </main>

  <!-- Shown for 5s when drawing time ends -->
  <div id="done-overlay" class="done-overlay hidden">
    <div class="done-card">
      <div class="done-stars">✏️ 🎨 ✏️</div>
      <div id="done-word" class="done-word"></div>
      <p class="done-next">Next word in <span id="done-countdown">5</span>s</p>
    </div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
