<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Permissionless Games</title>
  <meta name="description" content="Jump in. Play together. Anyone can join, leave, or go idle.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#5c6bc0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PGames">
  <link rel="stylesheet" href="lib/base.css">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1 class="site-title">🎮 Permissionless Games</h1>
    </div>
  </header>

  <main class="site-main">
    <div class="site-hero">
      <p class="hero-line1">Jump in. Play together.</p>
      <p class="hero-line2">Anyone can join, leave, or go idle.</p>
    </div>
    <div class="game-grid" id="game-grid"></div>
  </main>

  <script type="module">
    const GAMES = [
      {
        id: 'drawing-guess',
        title: 'Drawing Guess',
        tagline: 'Emoji clue. Hidden word. Tap letters to reveal it together.',
        emoji: '🎨',
        players: '1 – ∞',
        path: 'games/drawing-guess/',
      },
      {
        id: 'quick-draw',
        title: 'Quick Draw',
        tagline: 'Same word. 60 seconds. Everyone draws at once.',
        emoji: '✏️',
        players: '1 – ∞',
        path: 'games/quick-draw/',
      },
      {
        id: 'trivia-race',
        title: 'Trivia Race',
        tagline: 'Question appears. Tap the right answer fastest. New question every 15 seconds.',
        emoji: '🧠',
        players: '1 – ∞',
        path: 'games/trivia-race/',
      },
      {
        id: 'mind-meld',
        title: 'Mind Meld',
        tagline: 'A word appears. Type your first association. Match someone else\'s answer to score.',
        emoji: '🔮',
        players: '2 – ∞',
        path: 'games/mind-meld/',
      },
      {
        id: 'snap',
        title: 'Snap',
        tagline: 'Wait for the signal. Tap as fast as you can. Top 3 score points.',
        emoji: '⚡',
        players: '1 – ∞',
        path: 'games/snap/',
      },
    ];

    const grid = document.getElementById('game-grid');
    GAMES.forEach(game => {
      const card = document.createElement('article');
      card.className = 'game-card';
      card.innerHTML = `
        <div class="game-card-emoji" aria-hidden="true">${game.emoji}</div>
        <h2 class="game-card-title">${game.title}</h2>
        <p class="game-card-tagline">${game.tagline}</p>
        <div class="game-card-footer">
          <span class="game-card-players">👥 ${game.players} players</span>
          <a class="play-btn" href="${game.path}">Play →</a>
        </div>
      `;
      grid.appendChild(card);
    });
  </script>
</body>
</html>
